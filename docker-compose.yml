services:
  postgres:
    image: postgres:16.7
    container_name: management_db
    env_file:
      - ./management-service/.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}", ]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  pg_data:
