services:
  postgres_test:
    image: postgres:16.7
    container_name: management_test_db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: management_test_db
    ports:
      - "5433:5432"
    volumes:
      - pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d management_test_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pg_test_data:
